
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whack-a-Monster</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }

    .game-card {
      max-width: 650px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000015;
    }

    .hole {
      height: 100px;
      font-size: 42px;
      background: #dbeafe;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
    }

    .hole:hover {
      background: #bfdbfe;
    }

    #message {
      min-height: 28px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-controller"></i> Whack-a-Monster
    </a>
    <a class="btn btn-light btn-sm" href="pages/full.html">Full Game</a>
  </div>
</nav>

<main class="container">
  <section class="game-card text-center">
    <h1>👾 Whack-a-Monster</h1>
    <p>Click the monster to score points before time runs out!</p>

    <div class="mb-3">
      <label for="playerName" class="form-label">Your name</label>
      <input id="playerName" class="form-control"
        placeholder="Enter name (or leave blank for guest)">
    </div>

    <div class="d-flex justify-content-around mb-3">
      <h5>Score: <span id="score">0</span></h5>
      <h5>Time: <span id="time">30</span>s</h5>
    </div>

    <div id="board" class="row g-2">
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 1">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 2">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 3">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 4">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 5">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 6">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 7">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 8">⬜</button></div>
      <div class="col-4"><button class="hole w-100" aria-label="Game spot 9">⬜</button></div>
    </div>

    <p id="message" class="mt-3 fw-bold" aria-live="polite">Press Start to play!</p>

    <button id="start" class="btn btn-primary">Start Game</button>
    <button id="reset" class="btn btn-secondary">Reset</button>
    <button id="scoresButton" class="btn btn-outline-primary"
      data-bs-toggle="modal" data-bs-target="#scoresModal">Leaderboard</button>
  </section>
</main>

<div class="modal fade" id="scoresModal" tabindex="-1"
  aria-labelledby="scoresTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="scoresTitle" class="modal-title">Top Scores</h5>
        <button class="btn-close" data-bs-dismiss="modal"
          aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ol id="leaderboard"><li>No scores yet. Play a game!</li></ol>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3">
  <a href="https://github.com/pbell0330/dev-charlie">Game Repository</a> |
  <a href="https://github.com/pbell0330">My GitHub Profile</a> |
  <a href="pages/full.html">Play Full Game</a>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let score = 0;
  let time = 30;
  let timer = null;
  let playing = false;
  let monster = -1;

  const holes = $(".hole");

  function showMonster() {
    holes.text("⬜");
    monster = Math.floor(Math.random() * holes.length);
    holes.eq(monster).text("👾");
  }

  function startGame() {
    clearInterval(timer);
    score = 0;
    time = 30;
    playing = true;
    $("#score").text(score);
    $("#time").text(time);
    $("#message").text("Catch those monsters!");
    showMonster();

    timer = setInterval(function () {
      time--;
      $("#time").text(time);

      if (time <= 0) {
        endGame();
      } else {
        showMonster();
      }
    }, 1000);
  }

  function endGame() {
    clearInterval(timer);
    playing = false;
    holes.text("⬜");
    monster = -1;

    const enteredName = $("#playerName").val().trim();
    const name = enteredName || "Guest" +
      Math.floor(Math.random() * 900 + 100);

    $("#message").text(name + ", game over! Your score: " + score);

    const scores = JSON.parse(sessionStorage.getItem("scores") || "[]");
    scores.push({ name: name, score: score });
    scores.sort((a, b) => b.score - a.score);
    sessionStorage.setItem("scores", JSON.stringify(scores.slice(0, 5)));
    updateLeaderboard();
  }

  function updateLeaderboard() {
    const scores = JSON.parse(sessionStorage.getItem("scores") || "[]");
    $("#leaderboard").empty();

    if (scores.length === 0) {
      $("#leaderboard").append("<li>No scores yet. Play a game!</li>");
      return;
    }

    scores.forEach(function (entry) {
      $("<li>").text(entry.name + " — " + entry.score + " points")
        .appendTo("#leaderboard");
    });
  }

  holes.on("click", function () {
    if (playing && holes.index(this) === monster) {
      score += 10;
      $("#score").text(score);
      showMonster();
    }
  });

  $("#start").on("click", startGame);

  $("#reset").on("click", function () {
    clearInterval(timer);
    playing = false;
    score = 0;
    time = 30;
    monster = -1;
    holes.text("⬜");
    $("#score").text(score);
    $("#time").text(time);
    $("#message").text("Game reset. Press Start to play!");
  });

  updateLeaderboard();
</script>
</body>
</html>
